<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#f5f5f7" />
  <title>Лад — Песня</title>
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin />
  <link href="https://fonts.bunny.net/css?family=manrope:400,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20260925assets" />
</head>
<body>
  <div class="paper" aria-hidden="true"></div>

  <div class="shell">
    <header class="topbar">
      <button type="button" class="icon-btn" id="btnBack" aria-label="Назад" hidden>←</button>
      <div class="brand-wrap">
        <p class="brand">Лад</p>
        <p class="brand-tag">Песня</p>
      </div>
      <div class="instrument-bar" role="group" aria-label="Звук">
        <button type="button" class="instrument-btn" data-instrument="acoustic" aria-label="Акустическая гитара" aria-pressed="false">
          <img src="icons/acoustic.png" alt="" width="40" height="40" />
        </button>
        <button type="button" class="instrument-btn" data-instrument="distortion" aria-label="Дисторшн" aria-pressed="false">
          <img src="icons/distortion.png" alt="" width="40" height="40" />
        </button>
        <button type="button" class="instrument-btn" data-instrument="piano" aria-label="Фортепиано" aria-pressed="false">
          <img src="icons/piano.png" alt="" width="40" height="40" />
        </button>
      </div>
    </header>

    <main class="stage" id="stage" aria-live="polite"></main>

    <nav class="tabbar" aria-label="Разделы">
      <button type="button" class="tab is-active" data-nav="mood">
        <span class="tab-ico" aria-hidden="true">⌂</span>
        Комната
      </button>
      <button type="button" class="tab" data-nav="map">
        <span class="tab-ico" aria-hidden="true">◎</span>
        Карта
      </button>
      <button type="button" class="tab" data-nav="song">
        <span class="tab-ico" aria-hidden="true">≡</span>
        Дорожка
      </button>
    </nav>
  </div>

  <script src="catalog.js?v=20260925assets"></script>
  <script src="fingering.js?v=20260925assets"></script>
  <script src="detect.js?v=20260925assets"></script>
  <script src="theory.js?v=20260925assets"></script>
  <script src="audio.js?v=20260925assets"></script>
  <script src="export.js?v=20260925assets"></script>
  <script src="app.js?v=20260925assets"></script>
</body>
</html>
